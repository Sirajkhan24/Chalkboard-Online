<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Wooden Frame -->
  <rect x="20" y="20" width="360" height="240" rx="8" fill="#4a2e1b" stroke="#2d1a0e" stroke-width="3"/>
  
  <!-- Blackboard Surface -->
  <rect x="35" y="35" width="330" height="210" rx="4" fill="#1b3a2b"/>
  
  <!-- Simple Chalk Line -->
  <path d="M 80 140 Q 130 90 180 140 T 280 140" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
  
  <!-- Chalk Tray -->
  <rect x="40" y="238" width="320" height="10" rx="2" fill="#3b2314"/>
  
  <!-- Chalk Stick -->
  <rect x="150" y="232" width="35" height="8" rx="2" fill="#ffffff" transform="rotate(-4 150 232)"/>
</svg>
